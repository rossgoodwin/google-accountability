name: publish-page

# Rebuilds and deploys the status page from the latest saved results, without
# running a full check. Runs when page code changes, or by hand.
on:
  push:
    branches: [main]
    paths: ["watch/site.py", "watch/meters.py", "watch/config.py", "LICENSE",
            ".github/workflows/publish.yml"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-page
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow requests

      - name: Fetch the GOOG price
        continue-on-error: true
        run: |
          python - <<'PY'
          import datetime as dt
          from watch import meters, probes, run
          now = dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          try:
              old = run.load("snapshots/_stock.json", None)
              run.save("snapshots/_stock.json", meters.merge_stock(old, probes.stock(now)))
              print(open("snapshots/_stock.json").read()[:300])
          except Exception as e:
              print(f"::warning::GOOG price fetch failed: {e}"[:900])
          PY

      - name: Fetch the latest screenshots
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/$REPO/actions/artifacts?per_page=30" \
               --jq '[.artifacts[]|select(.name|startswith("screens-"))|select(.expired|not)][0].id')
          mkdir -p out/screens
          if [ -n "$id" ] && [ "$id" != "null" ]; then
            gh api "repos/$REPO/actions/artifacts/$id/zip" > /tmp/screens.zip
            unzip -qo /tmp/screens.zip -d out/screens
          fi
          ls out/screens | head

      - run: python -m watch.site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy page
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - name: Deploy page (retry)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before the last try
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90

      - name: Deploy page (last try)
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
