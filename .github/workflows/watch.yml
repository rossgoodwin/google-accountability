name: label-watch

on:
  schedule:
    # Layer 1: GitHub's scheduler, every 15 minutes off the busy marks.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Save raw OCR and page text to snapshots/_debug"
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: label-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get install -y -qq tesseract-ocr
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run probes
        id: run
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          LABEL_WATCH_DEBUG: ${{ inputs.debug && '1' || '' }}
        run: python -m watch.run

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ github.run_id }}
          path: out/screens/
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit snapshots
        run: |
          git config user.name "label-watch"
          git config user.email "label-watch@users.noreply.github.com"
          git add snapshots
          if ! git diff --cached --quiet; then
            git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Open an issue
        if: steps.run.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "" >> out/report.md
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> out/report.md
          gh label create label-watch --color B60205 --force >/dev/null
          gh issue create --title "$(cat out/title.txt)" --body-file out/report.md --label label-watch

      - name: Push to phone (optional)
        if: steps.run.outputs.changed == 'true' && env.NTFY_TOPIC != ''
        run: |
          curl -s --data-binary @out/title.txt \
               -H "Click: ${{ github.server_url }}/${{ github.repository }}/issues" \
               "https://ntfy.sh/$NTFY_TOPIC" >/dev/null

      # Status page. Needs Settings > Pages > Source set to "GitHub Actions";
      # until then these steps fail quietly and the watching carries on.
      - name: Build status page
        run: python -m watch.site

      - name: Configure Pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload page
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy page
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

  # Layer 2: each run starts the next one 15 minutes after it began, so the
  # checks keep going even when GitHub's scheduler skips slots. Runs share one
  # concurrency group, so extra starts collapse into a single queue.
  # To stop everything: Actions > label-watch > ... > Disable workflow.
  next:
    needs: watch
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait, then start the next check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          started=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_started_at)
          elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
          wait=$(( 900 - elapsed ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          gh api -X POST "repos/$REPO/actions/workflows/watch.yml/dispatches" -f ref=main
